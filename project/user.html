<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="max-age=3600, must-revalidate">
    <title>用户中心</title>
    <link rel="stylesheet" href="./style/basic.css" />
    <link rel="stylesheet" href="./style/user.css" />
</head>
<body>
    <div class="root">
        <!-- 桌面导航 -->
        <nav class="nav">
            <div class="page-list-btn">
                <div class="btn-inner"></div>
                <div class="btn-inner"></div>
                <div class="btn-inner"></div>
            </div>
            <div class="logo">JmViewer</div>
            <div class="pages">
                <div class="page-list">
                    <a class="p-item" href="./index.html">首页</a>
                    <a class="p-item" href="./latest.html">最新</a>
                    <a class="p-item" href="./categories.html">分类</a>
                </div>
            </div>
            <div class="search">
                <form>
                    <input type="search" placeholder="搜索" />
                </form>
            </div>
            <div class="pages-2">
                <div class="page-list">
                    <a class="p-item" href="#">
                        <span>历史</span>
                        <div class="small-icon">#</div>
                    </a>
                    <a class="p-item" href="./setting.html">
                        <span>设置</span>
                        <div class="small-icon">#</div>
                    </a>
                    <!-- 用户链接，添加 active 类 -->
                    <a class="p-item user-nav-link active" href="./user.html">
                        <span>登录</span>
                        <div class="small-icon">#</div>
                    </a>
                </div>
            </div>
        </nav>

        <!-- 移动端导航 -->
        <nav class="mob-nav">
            <div class="mn-inner">
                <div class="mn-head">
                    <img src="./image/cover.png" alt="头像">
                </div>
                <div class="mn-items-cr">
                    <a class="mn-item" href="./index.html">主页</a>
                    <a class="mn-item" href="./latest.html">最新</a>
                    <a class="mn-item" href="./categories.html">分类</a>
                    <a class="mn-item">历史</a>
                    <a class="mn-item" href="./setting.html">设置</a>
                    <!-- 移动端用户链接，添加 active 类 -->
                    <a class="mn-item user-nav-link active" href="./user.html">-登录-</a>
                </div>
            </div>
        </nav>

        <!-- 图源切换按钮 -->
        <div class="switch-server">
            <span>图源1</span>
            <div class="sh-sr-cr">
                <div class="server-name">图源1</div>
                <div class="server-name">图源2</div>
                <div class="server-name">图源3</div>
                <div class="server-name">图源4</div>
                <div class="server-name">图源5</div>
                <div class="server-name">图源6</div>
            </div>
        </div>

        <!-- 用户内容容器 -->
        <div class="user-body" id="user-content"></div>
    </div>

    <script type="module" src="./src/pages/user.js"></script>
</body>
</html>
